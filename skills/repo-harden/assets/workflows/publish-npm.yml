name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: {{CHECKOUT}}
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag (on {{DEFAULT_BRANCH}} and equal to package.json version)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/{{DEFAULT_BRANCH}} || {
            echo "::error::A tag $TAG is not in the history of origin/{{DEFAULT_BRANCH}}"; exit 1; }
          expected="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$expected" ] || {
            echo "::error::Tag $TAG differs from package.json version ($expected)"; exit 1; }

      - uses: {{SETUP_NODE}}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - run: npm install --global npm@{{NPM_VERSION}}

      - run: npm ci --ignore-scripts

      # {{VALIDATION_STEPS}}

      - run: npm pack --dry-run

      - run: npm publish --access public --provenance
