version: 2
updates:
  # One block per detected ecosystem and manifest directory (references/ecosystems.md).
  # {{ECOSYSTEM}}: npm | pip | uv | gomod | cargo | ...
  - package-ecosystem: {{ECOSYSTEM}}
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security-patch-minor:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
