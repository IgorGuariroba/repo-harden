name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck -S warning skills/repo-harden/scripts/*.sh skills/repo-harden/assets/githooks/*

      - name: Hook behavior
        run: skills/repo-harden/scripts/test-hooks.sh skills/repo-harden/assets/githooks

      - name: Audit secrets.scanning rows
        run: skills/repo-harden/scripts/test-audit-secrets.sh

      - name: Audit deps.vulns rows
        run: skills/repo-harden/scripts/test-audit-deps.sh

      - name: Audit review.bot rows
        run: skills/repo-harden/scripts/test-audit-review.sh

      - name: Audit protect.signed rows
        run: skills/repo-harden/scripts/test-audit-signed.sh

      - name: Audit hooks.quality rows
        run: skills/repo-harden/scripts/test-audit-quality.sh

      - name: Audit ignore.* rows
        run: skills/repo-harden/scripts/test-audit-ignore.sh

      - name: Audit IDs defined in checklist
        run: skills/repo-harden/scripts/test-checklist-ids.sh

      - name: No unresolved template placeholders outside assets
        run: "! grep -rn '{{' skills/repo-harden --include=*.sh"
